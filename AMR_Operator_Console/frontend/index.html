<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AMR Operator Console</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <h1>AMR Operator Console</h1>
  <button id="goal-toggle">
    Set Goal
  </button>
  <canvas id="map-canvas" width="600" height="600"></canvas>
  <div id="status-panel"></div>
  <div id="battery-panel"></div>
  <div id="teleop-pad">
    <button data-key="w">Forward</button>

    <div class="teleop-middle">
      <button data-key="a">Left</button>
      <button data-key="d">Right</button>
    </div>

    <button data-key="s">Backward</button>
  </div>
  <script type="module" src="src/ws_client.js"></script>
  <script type="module" src="src/map_renderer.js"></script>
  <script type="module" src="src/status_panel.js"></script>
  <script type="module" src="src/battery_panel.js"></script>
</body>
</html>

<script
    type="module"
    src="./src/lift_panel.js">
</script>

<div id="lift-panel" class="panel">

    <h3>Lift Control</h3>


    <div id="lift-fault" class="lift-fault">
        OK
    </div>


    <div class="lift-controls">

        <button id="lift-up">
            Raise
        </button>


        <button id="lift-down">
            Lower
        </button>


        <button id="lift-stop">
            Stop
        </button>

    </div>



    <div class="lift-target">

        <label>
            Target Position
        </label>

        <input
            id="lift-target"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0"
        >

    </div>



    <div class="lift-readout">

        <p>
            Position:
            <span id="lift-position">
                0
            </span>
        </p>


        <div class="lift-bar">

            <div
                id="lift-position-bar"
                class="lift-bar-fill">
            </div>

        </div>


        <p>
            Actuator A:
            <span id="lift-current-a">
                0 A
            </span>
        </p>


        <p>
            Actuator B:
            <span id="lift-current-b">
                0 A
            </span>
        </p>

    </div>


</div>

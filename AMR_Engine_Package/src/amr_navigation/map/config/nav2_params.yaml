planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 30.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.30
      max_vel_y: 0.0
      max_vel_theta: 0.80

      min_speed_xy: 0.05
      max_speed_xy: 0.30
      min_speed_theta: 0.05

      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.8

      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.8

      vx_samples: 40
      vy_samples: 1
      vtheta_samples: 40

      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2

      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - BaseObstacle
        - PathDist
        - GoalDist
        - PathAlign
        - GoalAlign
        - RotateToGoal
        - Oscillation

      BaseObstacle.scale: 0.02
      PathAlign.scale: 3.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 2.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 4.0
      GoalDist.scale: 3.0
      RotateToGoal.scale: 1.5
      RotateToGoal.slowing_factor: 3.0
      RotateToGoal.lookahead_time: 1.0
      Oscillation.scale: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

# NavigateThroughPoses routes its plan through the smoother server, which
# nav2_bringup brings up regardless; without these it runs on library
# defaults.
smoother_server:
  ros__parameters:
    use_sim_time: false

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # TODO: confirm against real chassis dimensions once known
      footprint: "[[0.4, 0.4], [0.4, -0.4], [-0.4, -0.4], [-0.4, 0.4]]"

      plugins:
        - obstacle_layer
        - inflation_layer

      # Costmap *filters* run after the layer stack above. amr_command
      # publishes both the mask and its filter info on latched topics, so no
      # costmap_filter_info_server / map_server pair is needed and an
      # operator's zone edit takes effect without a restart.
      filters:
        - keepout_filter

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45

      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: /costmap_filter_info

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      # TODO: confirm against real chassis dimensions once known
      footprint: "[[0.4, 0.4], [0.4, -0.4], [-0.4, -0.4], [-0.4, 0.4]]"
      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      # Same filter on the global costmap, so the planner refuses to route
      # through a zone in the first place rather than only the controller
      # refusing to drive into one.
      filters:
        - keepout_filter

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45

      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: /costmap_filter_info

velocity_smoother:
  ros__parameters:
    use_sim_time: false

    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"

    max_velocity:
      - 0.35
      - 0.0
      - 0.80

    min_velocity:
      - -0.35
      - 0.0
      - -0.80

    max_accel:
      - 1.0
      - 0.0
      - 1.8

    max_decel:
      - -1.0
      - 0.0
      - -1.8

    velocity_timeout: 0.5

behavior_server:
  ros__parameters:
    use_sim_time: false

    behavior_plugins:
      - spin
      - backup
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    wait:
      plugin: "nav2_behaviors/Wait"
